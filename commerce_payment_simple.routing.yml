commerce_payment_simple.payment_end:
  path: '/commerce-payment/safe-checkout/{order_id}/completed'
  defaults:
    _title: 'Payment terminé'
    _controller: '\Drupal\commerce_payment_simple\Controller\CommercePaymentSimpleController:paymentCompleted'
    _title_callback: '\Drupal\commerce_payment_simple\Controller\CommercePaymentSimpleController::getTitlePage'
  requirements:
    _permission: 'access content'
  options:
    # Désactive le cache de page
    no_cache: true


commerce_payment_simple.payment_one_step:
  path: '/commerce-payment/safe-checkout/{product_variation_id}'
  defaults:
    _title: 'Simple and secure payment'
    _controller: '\Drupal\commerce_payment_simple\Controller\CommercePaymentSimpleController:paymentOneStep'
    _title_callback: '\Drupal\commerce_payment_simple\Controller\CommercePaymentSimpleController::getTitlePage'
  requirements:
    _permission: 'access content'
  options:
    # Désactive le cache de page
    no_cache: true

commerce_payment_simple.settings:
  path: '/admin/config/system/settings'
  defaults:
    _title: 'Settings'
    _form: 'Drupal\commerce_payment_simple\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'
